<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="theme-color" content="#080b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="dcterms.rightsHolder" content="Created by Gianfranco Piazzolla in homage to Tonino Lucidi">
  <title>Il calcolatore di Tonino</title>
  <link rel="manifest" id="manifest-link">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --primary: #00e676;
      --secondary: #29b6f6;
      --danger: #ff1744;
      --warning: #ffd740;
      --tesla-red: #e21017;
      --bg-color: #080b10;
      --card-bg: #0f1318;
      --text-color: #e8edf2;
      --input-bg: #181d24;
      --border-color: #1e2530;
      --label-color: #4a5568;
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
      --header-bg: rgba(8, 11, 16, 0.92);
    }

    [data-theme="light"] {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1a1d23;
      --input-bg: #eef1f5;
      --border-color: #d1d5db;
      --label-color: #6b7280;
      --header-bg: rgba(255, 255, 255, 0.92);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Syne', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
      transition: background-color 0.3s, color 0.3s;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      margin-bottom: 40px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--tesla-red) 0%, transparent 60%);
    }

    h1 {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--tesla-red);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .theme-toggle {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-color);
      transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    }

    .theme-toggle:hover {
      background: var(--input-bg);
    }

    .calculator-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .calculator-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--tesla-red), var(--secondary));
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      font-weight: 600;
      transition: color 0.3s;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease, background-color 0.3s, border-color 0.3s, color 0.3s;
    }

    input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(41, 182, 246, 0.15);
    }

    .unit {
      position: absolute;
      right: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--label-color);
      font-weight: 700;
      pointer-events: none;
      transition: color 0.3s;
    }

    .calculate-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--tesla-red), #b71c1c);
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(226, 16, 23, 0.3);
    }

    .calculate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(226, 16, 23, 0.5);
    }

    .calculate-btn:active {
      transform: translateY(0);
    }

    .result-area {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
      transition: border-color 0.3s;
    }

    .result-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: block;
      transition: color 0.3s;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'JetBrains Mono', monospace;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
    }

    .result-unit {
      font-size: 1.2rem;
      color: var(--primary);
      margin-left: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Tonino's Calc</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Attiva/disattiva tema scuro/chiaro"></button>
  </header>

  <main class="calculator-card">
    <div class="input-group">
      <label>Capacità Batteria Utilizzabile</label>
      <div class="input-wrapper">
        <input type="number" id="capacity" value="100" step="0.5">
        <span class="unit">kWh</span>
      </div>
    </div>

    <div class="input-group">
      <label>SoC Iniziale</label>
      <div class="input-wrapper">
        <input type="number" id="socStart" value="0" min="0" max="200">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="input-group">
      <label>SoC Finale</label>
      <div class="input-wrapper">
        <input type="number" id="socTarget" value="100" min="0" max="200">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="input-group">
      <label>Efficienza di Trasferimento</label>
      <div class="input-wrapper">
        <input type="number" id="efficiency" value="90" min="1" max="100">
        <span class="unit">%</span>
      </div>
    </div>

    <button class="calculate-btn" onclick="calculate()">Calcola Energia</button>

    <div class="result-area">
      <span class="result-label">Energia Prelevata</span>
      <div id="resultDisplay" class="result-value">--<span class="result-unit">kWh</span></div>
    </div>
  </main>

  <script>
    function calculate() {
      const cap = parseFloat(document.getElementById('capacity').value) || 0;
      const s1 = parseFloat(document.getElementById('socStart').value) || 0;
      const s2 = parseFloat(document.getElementById('socTarget').value) || 0;
      const eff = parseFloat(document.getElementById('efficiency').value) || 100;

      if (s2 <= s1) {
        document.getElementById('resultDisplay').innerHTML = '0.00<span class="result-unit">kWh</span>';
        return;
      }

      const netKwh = ((s2 - s1) / 100) * cap;
      const drawnKwh = netKwh / (eff / 100);

      document.getElementById('resultDisplay').innerHTML = drawnKwh.toFixed(2) + '<span class="result-unit">kWh</span>';
    }

    (function() {
      var html = document.documentElement;
      var toggle = document.getElementById('themeToggle');
      var themeColor = document.getElementById('theme-color');

      var saved = localStorage.getItem('theme');
      if (!saved) {
        html.setAttribute('data-theme', 'dark');
      }
      updateToggleIcon();
      updateThemeColorMeta();

      toggle.addEventListener('click', function() {
        var current = html.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateToggleIcon();
        updateThemeColorMeta();
      });

      function updateToggleIcon() {
        var isDark = html.getAttribute('data-theme') === 'dark';
        toggle.innerHTML = isDark
          ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }

      function updateThemeColorMeta() {
        var isDark = html.getAttribute('data-theme') === 'dark';
        themeColor.setAttribute('content', isDark ? '#080b10' : '#f4f6f9');
      }
    })();

    (function() {
      var manifest = {
        name: 'Il calcolatore di Tonino',
        short_name: 'Tonino Calc',
        description: 'Calcolatore energetico ispirato a Tonino Lucidi',
        start_url: '.',
        display: 'standalone',
        background_color: '#080b10',
        theme_color: '#080b10',
        icons: [
          {
            src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#e21017"/><text x="96" y="128" text-anchor="middle" font-size="100" font-family="Arial,sans-serif" font-weight="bold" fill="white">TC</text></svg>'),
            sizes: '192x192',
            type: 'image/svg+xml'
          },
          {
            src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="64" fill="#e21017"/><text x="256" y="340" text-anchor="middle" font-size="280" font-family="Arial,sans-serif" font-weight="bold" fill="white">TC</text></svg>'),
            sizes: '512x512',
            type: 'image/svg+xml'
          }
        ]
      };

      var dataUri = 'data:application/json,' + encodeURIComponent(JSON.stringify(manifest));
      document.getElementById('manifest-link').href = dataUri;

      if ('serviceWorker' in navigator) {
        var swCode = 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return new Response("",{status:408})}))});';
        var swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function(){});
      }
    })();
  </script>
</body>
</html>
