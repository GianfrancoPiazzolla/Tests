<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dcterms.rightsHolder" content="Created by Gianfranco Piazzolla in homage to Tonino Lucidi">
  <title>Il calcolatore di Tonino</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #00e676;
      --secondary: #29b6f6;
      --danger: #ff1744;
      --warning: #ffd740;
      --tesla-red: #e21017;
      --bg-color: #080b10;
      --card-bg: #0f1318;
      --text-color: #e8edf2;
      --input-bg: #181d24;
      --border-color: #1e2530;
      --label-color: #4a5568;
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
      --header-bg: rgba(8, 11, 16, 0.92);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Syne', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      margin-bottom: 40px;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--tesla-red) 0%, transparent 60%);
    }

    h1 {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--tesla-red);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--tesla-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--tesla-red);
    }

    .calculator-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }

    .calculator-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--tesla-red), var(--secondary));
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(41, 182, 246, 0.15);
    }

    .unit {
      position: absolute;
      right: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--label-color);
      font-weight: 700;
      pointer-events: none;
    }

    .calculate-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--tesla-red), #b71c1c);
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(226, 16, 23, 0.3);
    }

    .calculate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(226, 16, 23, 0.5);
    }

    .calculate-btn:active {
      transform: translateY(0);
    }

    .result-area {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }

    .result-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: block;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'JetBrains Mono', monospace;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
    }

    .result-unit {
      font-size: 1.2rem;
      color: var(--primary);
      margin-left: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Il calcolatore di Tonino</h1>
  </header>

  <main class="calculator-card">
    <div class="input-group">
      <label>Capacità Batteria Utilizzabile</label>
      <div class="input-wrapper">
        <input type="number" id="capacity" value="100" step="0.5">
        <span class="unit">kWh</span>
      </div>
    </div>

    <div class="input-group">
      <label>SoC Iniziale</label>
      <div class="input-wrapper">
        <input type="number" id="socStart" value="0" min="0" max="200">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="input-group">
      <label>SoC Finale</label>
      <div class="input-wrapper">
        <input type="number" id="socTarget" value="100" min="0" max="200">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="input-group">
      <label>Efficienza di Trasferimento</label>
      <div class="input-wrapper">
        <input type="number" id="efficiency" value="90" min="1" max="100">
        <span class="unit">%</span>
      </div>
    </div>

    <button class="calculate-btn" onclick="calculate()">Calcola Energia</button>

    <div class="result-area">
      <span class="result-label">Energia Prelevata</span>
      <div id="resultDisplay" class="result-value">--<span class="result-unit">kWh</span></div>
    </div>
  </main>

  <script>
    function calculate() {
      const cap = parseFloat(document.getElementById('capacity').value) || 0;
      const s1 = parseFloat(document.getElementById('socStart').value) || 0;
      const s2 = parseFloat(document.getElementById('socTarget').value) || 0;
      const eff = parseFloat(document.getElementById('efficiency').value) || 100;

      if (s2 <= s1) {
        document.getElementById('resultDisplay').innerHTML = '0.00<span class="result-unit">kWh</span>';
        return;
      }

      const netKwh = ((s2 - s1) / 100) * cap;
      const drawnKwh = netKwh / (eff / 100);

      document.getElementById('resultDisplay').innerHTML = drawnKwh.toFixed(2) + '<span class="result-unit">kWh</span>';
    }
  </script>
</body>

</html>
